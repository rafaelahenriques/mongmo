name: Deploy

# Ships a commit to staging or production: database migrations, then iOS and
# Android builds on EAS, optionally sent on to the stores. Every CI check runs
# first. Each target is a GitHub environment with its own secrets; give
# "production" required reviewers so nothing reaches customers without an
# approval.
#
# Runs three ways:
#   - by hand: Actions → Deploy → Run workflow;
#   - from preview.yml, to staging, on every merge to main;
#   - from release.yml, to production, for a version tag.
# The full procedure, and how to roll back: docs/DEPLOYMENT.md and
# docs/release-process.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      ship:
        description: What to ship
        type: choice
        options: [database and app, database only, app only]
        default: database and app
      submit:
        description: Send production builds to TestFlight and Google Play (internal testing)
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      ship:
        type: string
        default: database and app
      submit:
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  database:
    name: Database migrations
    needs: checks
    if: inputs.ship != 'app only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest
      - name: Check the environment is set up
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret to the '${{ inputs.target }}' environment (docs/DEPLOYMENT.md)."
            exit 1
          fi
      - name: Apply new migrations (the seed never runs here)
        run: |
          mkdir -p "$RUNNER_TEMP/db" && cd "$RUNNER_TEMP/db"
          supabase init
          cp -r "$GITHUB_WORKSPACE/supabase/migrations" supabase/
          echo "Migrations that will run:"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

  app:
    name: App builds on EAS
    needs: [checks, database]
    if: >-
      always() && inputs.ship != 'database only' && needs.checks.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check the environment is set up
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret to the '${{ inputs.target }}' environment (docs/DEPLOYMENT.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start iOS and Android builds
        # The EAS build runs the unit tests again (eas-build-post-install)
        # and fails if any do. With submit, each finished build goes to
        # TestFlight and Google Play's internal testing track (eas.json →
        # submit.production); promoting it to the stores stays a human step.
        env:
          PROFILE: ${{ inputs.target }}
          SUBMIT: ${{ inputs.target == 'production' && inputs.submit && '--auto-submit' || '' }}
        run: eas build --profile "$PROFILE" --platform all --non-interactive --no-wait $SUBMIT
