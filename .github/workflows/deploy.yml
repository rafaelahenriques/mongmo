name: Deploy

# By hand only: Actions → Deploy → Run workflow, then pick staging or
# production and what to ship. Every CI check runs first. Each target is a
# GitHub environment holding its own secrets; give "production" required
# reviewers so nothing reaches customers without an approval.
# The full procedure, and how to roll back: docs/DEPLOYMENT.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      ship:
        description: What to ship
        type: choice
        options: [database and app, database only, app only]
        default: database and app

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  database:
    name: Database migrations
    needs: checks
    if: inputs.ship != 'app only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Check the environment is set up
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret to the '${{ inputs.target }}' environment (docs/DEPLOYMENT.md)."
            exit 1
          fi
      - name: Apply new migrations (the seed never runs here)
        run: |
          mkdir -p "$RUNNER_TEMP/db" && cd "$RUNNER_TEMP/db"
          supabase init
          cp -r "$GITHUB_WORKSPACE/supabase/migrations" supabase/
          echo "Migrations that will run:"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

  app:
    name: App builds on EAS
    needs: [checks, database]
    if: >-
      always() && inputs.ship != 'database only' && needs.checks.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check the environment is set up
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret to the '${{ inputs.target }}' environment (docs/DEPLOYMENT.md)."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start iOS and Android builds
        # The EAS build runs the unit tests again (eas-build-post-install)
        # and fails if any do.
        run: eas build --profile ${{ inputs.target }} --platform all --non-interactive --no-wait
