name: CI

# On every push and pull request: lint, formatting, types, unit tests, a
# dependency audit and the web build; the integration tests against a fresh
# local Supabase; and the accessibility walk-through of every screen. Any
# error, or any lint warning, fails the run.
#
# Actions are pinned to a commit, with the version in a comment; Dependabot
# keeps them current.
on:
  push:
  pull_request:
  workflow_call:

concurrency:
  # github.workflow keeps a CI run called by Deploy apart from the push's own.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, format, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (warnings fail too)
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Privacy policy web page matches the app's text
        run: npm run privacy:page -- --check
      - name: Type check
        run: npm run typecheck
      - name: Type check the Edge Functions (Deno)
        # The payment functions run on Deno, not in the app: checked with
        # Deno's own type checker. Their logic is unit tested with the app's.
        run: npx --yes deno@2.9.6 check supabase/functions/*/index.ts
      - name: Unit tests
        run: npm test -- --ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Build the web app
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: https://ci-build-check.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-build-check-anon-key
        run: npx expo export --platform web --output-dir dist

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/local-supabase
      - name: Integration tests
        run: npm run test:integration -- --ci

  a11y:
    name: Accessibility, ${{ matrix.label }} (every screen, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scheme: light, contrast: no-preference, label: light mode }
          - { scheme: dark, contrast: no-preference, label: dark mode }
          - { scheme: light, contrast: more, label: 'light mode, high contrast' }
          - { scheme: dark, contrast: more, label: 'dark mode, high contrast' }
    env:
      A11Y_COLOR_SCHEME: ${{ matrix.scheme }}
      A11Y_CONTRAST: ${{ matrix.contrast }}
      # A throwaway owner on the throwaway database, for the owner screens.
      OWNER_EMAIL: owner-a11y@mongmo.test
      OWNER_PASSWORD: owner-a11y-ci-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/local-supabase
      - name: Build the web app against the local Supabase
        run: |
          EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL" EXPO_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            npx expo export --platform web --output-dir dist
      - name: An owner account, and a reported photo for it to review
        run: node tests/a11y/seed-owner.mjs
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Walk every screen under the security headers
        run: |
          npm run serve:web -- dist 8090 "$SUPABASE_URL" &
          for i in $(seq 1 30); do curl -sf http://localhost:8090 > /dev/null && break; sleep 1; done
          APP_URL=http://localhost:8090 A11Y_WAIT_MS=1500 npm run test:a11y
