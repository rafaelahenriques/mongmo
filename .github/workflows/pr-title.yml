name: PR title

# Pull request titles become the commit on main (squash merge), so they must
# follow Conventional Commits: CONTRIBUTING.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::\"$TITLE\" isn't a Conventional Commit title, e.g. \"feat(order): pick a pickup time\". See CONTRIBUTING.md."
            exit 1
          fi
