name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include passwords, codes, or other people's names, emails or photos.
        **Security problems:** don't open an issue; follow SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Order
        2. Tap …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [iOS, Android, Web]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and build
      description: Account → Settings, at the bottom (e.g. 1.2.0 (34)).
  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: iPhone 15, iOS 26.1
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Production (store), Staging (test build), Development]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or a Sentry link
      description: Crop out anything personal.
