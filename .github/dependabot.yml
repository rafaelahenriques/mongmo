# Weekly update pull requests for npm packages and GitHub Actions.
# Security fixes come as soon as an advisory is published, whatever the
# schedule (turn on Dependabot security updates: docs/github-setup.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Brussels
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    labels: [dependencies]
    groups:
      # Expo SDK packages move together, with `npx expo install --fix`.
      # Upgrade the SDK by hand (docs/release-process.md), not package by package.
      expo-sdk:
        patterns:
          [
            'expo',
            'expo-*',
            '@expo/*',
            'jest-expo',
            'eslint-config-expo',
            'react',
            'react-dom',
            'react-native',
            'react-native-*',
            '@react-native/*',
            '@types/react',
          ]
        update-types: [patch]
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Major versions of the SDK's own packages come with an SDK upgrade.
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # eslint-config-expo needs ESLint 9 (ESLint 10 breaks eslint-plugin-react).
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Brussels
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
