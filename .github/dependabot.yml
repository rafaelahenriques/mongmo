# Weekly update pull requests for npm packages and GitHub Actions.
# Security fixes come as soon as an advisory is published, whatever the
# schedule (turn on Dependabot security updates: docs/github-setup.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Brussels
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    labels: [dependencies]
    groups:
      # Expo SDK packages move together, with `npx expo install --fix`.
      # Upgrade the SDK by hand (docs/release-process.md), not package by package.
      expo-sdk:
        patterns: ['expo', 'expo-*', '@expo/*', 'jest-expo', 'eslint-config-expo']
        update-types: [patch]
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The SDK's own packages: minor and major versions come with an SDK upgrade.
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Packages Expo SDK 58 pins to an exact version (expo's
      # bundledNativeModules.json): only an SDK upgrade moves them. A newer
      # one fails `npx expo install --check` and may not match the native code.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-maps'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-svg'
      - dependency-name: 'react-native-worklets'
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: '@react-native-community/netinfo'
      # Packages Expo pins to a ~ range: patches are fine, nothing newer.
      - dependency-name: '@sentry/react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # eslint-config-expo needs ESLint 9 (ESLint 10 breaks eslint-plugin-react),
      # and its TypeScript parser doesn't read TypeScript 7 yet.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Brussels
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
